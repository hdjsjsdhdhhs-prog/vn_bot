<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение к подписке</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; background: #f4f6f8; color: #20262d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        main { width: min(100% - 32px, 560px); margin: 0 auto; padding: 32px 0 48px; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; font-size: 18px; font-weight: 700; }
        .brand img { width: 36px; height: 36px; object-fit: contain; }
        .panel { background: #ffffff; border: 1px solid #dce2e8; border-radius: 8px; padding: 24px; box-shadow: 0 8px 24px rgba(32, 38, 45, 0.08); }
        h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; }
        .lead { margin: 0 0 24px; color: #5c6975; line-height: 1.5; }
        .details { border-top: 1px solid #e6ebef; border-bottom: 1px solid #e6ebef; margin: 20px 0 24px; padding: 4px 0; }
        .detail { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; font-size: 14px; }
        .detail dt { color: #5c6975; }
        .detail dd { margin: 0; text-align: right; font-weight: 600; }
        .status { color: #106c4b; }
        .qr { display: block; width: min(100%, 280px); height: auto; margin: 0 auto 12px; image-rendering: pixelated; }
        .qr-note { margin: 0 0 24px; color: #5c6975; text-align: center; font-size: 14px; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .url-row { display: flex; gap: 8px; }
        input { min-width: 0; flex: 1; border: 1px solid #b8c3cd; border-radius: 6px; background: #f9fafb; color: #20262d; padding: 12px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
        button { flex: 0 0 auto; border: 1px solid #106c4b; border-radius: 6px; background: #106c4b; color: #ffffff; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #0d5a3f; }
        button:focus-visible, input:focus-visible { outline: 3px solid #8acdb4; outline-offset: 2px; }
        #copy-status { min-height: 20px; margin: 10px 0 0; color: #106c4b; font-size: 14px; }
        @media (max-width: 480px) { main { width: min(100% - 24px, 560px); padding-top: 20px; } .panel { padding: 20px; } .url-row { flex-direction: column; } button { width: 100%; } .detail { align-items: flex-start; flex-direction: column; gap: 4px; } .detail dd { text-align: left; } }
    </style>
</head>
<body>
    <main>
        <div class="brand"><img src="/static/logo.png" alt=""><span>RS8 KVN</span></div>
        <section class="panel" aria-labelledby="page-title">
            <h1 id="page-title">Подключение к подписке</h1>
            <p class="lead">Сканируйте QR-код или скопируйте ссылку подписки в ваше приложение.</p>

            <dl class="details">
                <div class="detail"><dt>Статус</dt><dd class="status">{{.StatusLabel}}</dd></div>
                <div class="detail"><dt>Срок действия</dt><dd>{{.ExpiresAt}}</dd></div>
            </dl>

            <img class="qr" src="{{.QRCodeDataURL}}" alt="QR-код ссылки подписки">
            <p class="qr-note">QR-код содержит только публичную ссылку подписки.</p>

            <label for="subscription-url">Ссылка подписки</label>
            <div class="url-row">
                <input id="subscription-url" type="text" value="{{.SubURL}}" readonly aria-describedby="copy-status">
                <button id="copy-url" type="button">Скопировать</button>
            </div>
            <p id="copy-status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script>
        (function () {
            var input = document.getElementById('subscription-url');
            var button = document.getElementById('copy-url');
            var status = document.getElementById('copy-status');

            function showMessage(message) {
                status.textContent = message;
            }

            function fallbackCopy() {
                input.focus();
                input.select();
                try {
                    if (!document.execCommand('copy')) {
                        throw new Error('copy failed');
                    }
                    showMessage('Ссылка скопирована.');
                } catch (error) {
                    showMessage('Выделите и скопируйте ссылку вручную.');
                }
            }

            button.addEventListener('click', function () {
                var value = input.value;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(value).then(function () {
                        showMessage('Ссылка скопирована.');
                    }, fallbackCopy);
                    return;
                }
                fallbackCopy();
            });
        }());
    </script>
</body>
</html>
